<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="IN //fluency">
  <title>IN //fluency</title>
  <defs>
    <!-- Tight, dim lime glow — echoes the site hero without washing the forest green out. -->
    <radialGradient id="glow" cx="0.82" cy="0.13" r="0.58">
      <stop offset="0"    stop-color="#C8F542" stop-opacity="0.26"/>
      <stop offset="0.5"  stop-color="#C8F542" stop-opacity="0.05"/>
      <stop offset="1"    stop-color="#C8F542" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed: iOS and Android apply their own corner mask. -->
  <rect width="512" height="512" fill="#0B2E1F"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- The "//" mark as rounded bars rather than text, so it is
       font-independent. 28deg slant reads unambiguously as slashes.
       Centred on 256,256, inside the 80% maskable safe zone. -->
  <g fill="#C8F542">
    <rect x="-23" y="-107" width="46" height="214" rx="23" transform="translate(202 256) rotate(28)"/>
    <rect x="-23" y="-107" width="46" height="214" rx="23" transform="translate(310 256) rotate(28)"/>
  </g>
</svg>
