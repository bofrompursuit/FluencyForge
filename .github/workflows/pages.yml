name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/busy-edison-0q5otg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement: true turns Pages on for the repo if it isn't already,
      # so this needs no manual setup in repo settings.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Static site — the repo root is the site root, no build step.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
